    main { padding-top: 32px; }

    .work-title {
      text-align: center;
      margin: 0 0 48px;

    .work-title h1 {
      margin: 0;
      font-size: 1.6em;
      font-weight: 600;
      letter-spacing: 0.04em;

    .work-title p {
      margin: 10px 0 0;

      letter-spacing: 0.08em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px 20px;
    }

    .tile {
      background: #FFFFFF;
      position: relative;
      aspect-ratio: 320 / 270;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 12px;
      -webkit-tap-highlight-color: transparent;
    }

    .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    .tile img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .tile .play {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .tile .play svg { width: 12px; height: 12px; margin-left: 2px; }
    .tile.playing .play { opacity: 0; }

    .hint {
      text-align: center;
      font-size: 0.82em;
      color: var(--muted);
      margin: 28px 0 0;
      letter-spacing: 0.04em;
    }

    .meta {
      margin: 56px auto 0;
      text-align: center;
      font-size: 0.88em;
      color: var(--muted);
      line-height: 2;
    }

    .meta .status {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 14px;
      background: var(--surface);
    }

    .meta a { color: var(--accent); text-decoration: none; }
    .meta a:hover { text-decoration: underline; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 20px 12px; }
      main { padding-top: 24px; }
      .work-title { margin-bottom: 32px; }
    }
  </style>

  <script>
    (function () {
      var PLAY_MS = 4300;
      var hoverable = window.matchMedia('(hover: hover)').matches;

      function toBlob(src) {
        if (src.indexOf('data:') === 0) {
          var comma = src.indexOf(',');
          var bin = atob(src.slice(comma + 1));
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) { bytes[i] = bin.charCodeAt(i); }
          return Promise.resolve(new Blob([bytes], { type: 'image/png' }));
        }
        return fetch(src).then(function (r) { return r.blob(); });
      }

      Array.prototype.forEach.call(document.querySelectorAll('.tile'), function (tile) {
        var img = tile.querySelector('img');
        var still = img.getAttribute('src');
        var anim = tile.getAttribute('data-anim');
        var blob = null;
        var url = null;
        var timer = null;
        var loading = false;

        function stop() {
          tile.classList.remove('playing');
          img.src = still;
          if (url) { URL.revokeObjectURL(url); url = null; }
        }

        function start() {
          if (url) { URL.revokeObjectURL(url); }
          url = URL.createObjectURL(blob);
          img.src = url;
          tile.classList.add('playing');
          clearTimeout(timer);
          timer = setTimeout(stop, PLAY_MS);
        }

        function play() {
          if (blob) { start(); return; }
          if (loading) { return; }
          loading = true;
          toBlob(anim).then(function (b) { blob = b; loading = false; start(); })
            .catch(function () { loading = false; });
        }

        tile.addEventListener('click', play);
        if (hoverable) { tile.addEventListener('mouseenter', play); }
      });
    })();
  </script>
