<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>制作物 | 合同会社ゼク</title>
  <meta name="description" content="合同会社ゼク（ZEC Inc.）の制作物。LINE アニメーションスタンプ「みけねこの毎日あいさつ（動く）」。">
  <link rel="canonical" href="https://zec-inc.jp/works/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ZEC Inc.">
  <meta property="og:title" content="制作物 | 合同会社ゼク">
  <meta property="og:description" content="LINE アニメーションスタンプ「みけねこの毎日あいさつ（動く）」">
  <meta property="og:url" content="https://zec-inc.jp/works/">
  <meta property="og:image" content="https://zec-inc.jp/works/img/mikeneko-8.png">
  <style>
    :root {
      --bg: #faf9f6;
      --tile: #ffffff;
      --text: #2a2a2a;
      --muted: #8a8580;
      --line: #e8e4de;
      --brand: #2c3e50;
      --link: #2563eb;
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      max-width: 1080px;
      margin: 0 auto;
      padding: 22px 24px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.9em;
    }

    .topbar a { color: var(--brand); text-decoration: none; }
    .topbar a:hover { text-decoration: underline; }
    .brand { font-weight: 600; letter-spacing: 0.02em; }
    .topbar nav { display: flex; gap: 20px; }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 48px 24px 96px;
    }

    .work-title {
      text-align: center;
      margin: 0 0 56px;
    }

    .work-title h1 {
      margin: 0;
      font-size: 1.6em;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .work-title p {
      margin: 10px 0 0;
      font-size: 0.9em;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .tile {
      background: var(--tile);
      border-radius: 14px;
      aspect-ratio: 320 / 270;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(40, 30, 20, 0.04), 0 8px 24px rgba(40, 30, 20, 0.05);
    }

    .tile img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .meta {
      margin: 64px auto 0;
      max-width: 640px;
      text-align: center;
      font-size: 0.9em;
      color: var(--muted);
      line-height: 2;
    }

    .meta .status {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 14px;
      color: var(--muted);
      background: #fff;
    }

    .meta a { color: var(--link); text-decoration: none; }
    .meta a:hover { text-decoration: underline; }
    .meta .dot { margin: 0 8px; color: var(--line); }

    footer {
      text-align: center;
      font-size: 0.85em;
      color: var(--muted);
      padding: 24px 24px 40px;
      border-top: 1px solid var(--line);
    }

    footer a { color: inherit; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .footer-links { margin-top: 6px; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
      main { padding: 32px 16px 72px; }
      .work-title { margin-bottom: 36px; }
    }

    @media (max-width: 420px) {
      .grid { gap: 12px; }
      .tile { border-radius: 10px; }
      .topbar nav { gap: 14px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="topbar">
      <a class="brand" href="/">合同会社ゼク</a>
      <nav aria-label="Primary">
        <a href="/apps/">Apps</a>
        <a href="/works/" aria-current="page">Works</a>
      </nav>
    </div>
  </header>

  <main>

    <div class="work-title">
      <h1>みけねこの毎日あいさつ（動く）</h1>
      <p>LINE アニメーションスタンプ · 8 個 · 2026</p>
    </div>

    <div class="grid">
      <div class="tile"><img src="/works/img/mikeneko/01.png" width="320" height="270" alt="ありがとう"></div>
      <div class="tile"><img src="/works/img/mikeneko/02.png" width="320" height="270" alt="OK！"></div>
      <div class="tile"><img src="/works/img/mikeneko/03.png" width="320" height="270" alt="おつかれ〜"></div>
      <div class="tile"><img src="/works/img/mikeneko/04.png" width="320" height="270" alt="ごめんね"></div>
      <div class="tile"><img src="/works/img/mikeneko/05.png" width="320" height="270" alt="おはよ〜" loading="lazy"></div>
      <div class="tile"><img src="/works/img/mikeneko/06.png" width="320" height="270" alt="おやすみ…" loading="lazy"></div>
      <div class="tile"><img src="/works/img/mikeneko/07.png" width="320" height="270" alt="やったー！" loading="lazy"></div>
      <div class="tile"><img src="/works/img/mikeneko/08.png" width="320" height="270" alt="おねがい！" loading="lazy"></div>
    </div>

    <p class="meta">
      <span class="status">LINE Creators Market 審査中</span><br>
      ZEC<span class="dot">·</span>250 円<span class="dot">·</span><a href="https://note.com/zec_apps" target="_blank" rel="noopener">note</a>
    </p>

  </main>

  <footer>
    <div>&copy; 2026 ZEC Inc.</div>
    <div class="footer-links">
      <a href="/">Home</a> · <a href="/apps/">Apps</a> · <a href="/works/">Works</a> · <a href="/privacy.html">Privacy</a>
    </div>
  </footer>

</body>
</html>
